name: Deploy Animation Chart to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'animation-chart/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: animation-chart/package-lock.json

      - name: Install and build
        working-directory: animation-chart
        run: |
          npm ci
          VITE_BASE=/AAT9/ npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: animation-chart/dist

      - id: deployment
        uses: actions/deploy-pages@v4
